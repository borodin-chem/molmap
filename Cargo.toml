[package]
name = "molmap"
version = "0.1.0"
edition = "2024"
description = "Arena-based molecular structure representation"
readme = "README.md"
repository = "https://github.com/borodin-chem/molmap"
license = "MPL-2.0"
keywords = [ "chemistry", "cheminformatics", "materials", "molecule", "graph" ]
categories = [ "science", "science::computational-chemistry", "science::computational-chemistry::cheminformatics", "science::materials" ]

[dependencies]
mendeleev = { version = "0.8.4", default-features = false, features = ["all_lists", "oxidation_states", "atomic_number", "atomic_weight", "group_number", "jmol_color", "name", "symbol", "all_isotope_properties"] }
nalgebra = "0.35"
paste = "1.0.15"
slotmap = "1.1.1"
thiserror = "2.0.18"
